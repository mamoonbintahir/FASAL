# Local backend: MongoDB + FASAL API.
#   docker compose up --build
# Then run the app with:  flutter run --dart-define=API_BASE_URL=http://10.0.2.2:8080
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      - mongo
    environment:
      APP_ENV: development        # returns the OTP in the response (no SMS provider needed)
      MONGODB_URI: mongodb://mongo:27017/fasal
      JWT_SECRET: local-development-secret-change-me-0123456789
      WEATHER_PROVIDER: openmeteo
    ports:
      - "8080:8080"

volumes:
  mongo-data:
