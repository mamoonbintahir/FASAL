name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: fasal_core (shared Dart package)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/fasal_core
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test

  server:
    name: Dart server (API + MongoDB)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - name: Test (in-memory + real MongoDB)
        env:
          MONGODB_URI: mongodb://localhost:27017/fasal_test
        run: dart test --reporter expanded
      - name: Smoke test the compiled server over HTTP
        env:
          MONGODB_URI: mongodb://localhost:27017/fasal_smoke
          JWT_SECRET: ci-smoke-secret-that-is-long-enough-0123456789
          WEATHER_PROVIDER: sample
        run: |
          dart compile exe bin/server.dart -o /tmp/fasal-server
          /tmp/fasal-server > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8080/health && break; sleep 1; done
          CODE=$(curl -sf -X POST localhost:8080/v1/auth/otp/request -H 'content-type: application/json' -d '{"phone":"03001234567"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["devCode"])')
          TOKEN=$(curl -sf -X POST localhost:8080/v1/auth/otp/verify -H 'content-type: application/json' -d "{\"phone\":\"03001234567\",\"code\":\"$CODE\"}" | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          curl -sf -X PUT localhost:8080/v1/me/profile -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' -d '{"district":"Sahiwal","farmArea":5}'
          curl -sf localhost:8080/v1/weather -H "authorization: Bearer $TOKEN" | python3 -c 'import sys,json;d=json.load(sys.stdin);assert len(d["daily"])==7;print("weather ok")'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/v1/crops)" = "401"
          cat /tmp/server.log
      - name: Docker image builds
        working-directory: .
        run: docker build -f server/Dockerfile -t fasal-api .

  analyze-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate platform folders
        run: bash tool/setup_platforms.sh

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --reporter expanded

      - name: Build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v5
        with:
          name: fasal-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  screenshots:
    # Renders key screens with real fonts + emoji and publishes them to the
    # `ci-screenshots` branch for visual review.
    if: github.event_name != 'pull_request'
    needs: analyze-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Download emoji font
        run: curl -sSL -o /tmp/NotoEmoji.ttf 'https://raw.githubusercontent.com/google/fonts/main/ofl/notoemoji/NotoEmoji%5Bwght%5D.ttf'
      - name: Render screenshots
        env:
          FASAL_SCREENSHOTS: '1'
          EMOJI_FONT: /tmp/NotoEmoji.ttf
        run: flutter test --update-goldens test/screenshots
      - name: Publish to ci-screenshots branch
        run: |
          mkdir -p /tmp/shots && cp test/screenshots/goldens/*.png /tmp/shots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-screenshots
          git rm -rfq .
          cp /tmp/shots/*.png .
          git add ./*.png
          git commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -f origin ci-screenshots
