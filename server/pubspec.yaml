name: fasal_server
description: FASAL REST API — Dart (Shelf) + MongoDB. Shares models and rules with the Flutter app via fasal_core.
version: 0.2.0
publish_to: 'none'

environment:
  sdk: ^3.13.0

dependencies:
  fasal_core:
    path: ../packages/fasal_core
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  http: ^1.5.0
  mongo_dart: ^0.10.10
  crypto: ^3.0.6
  logging: ^1.3.0

dev_dependencies:
  test: ^1.26.0
  lints: ^6.0.0
